<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="KivU terms of use for the local-first encrypted journal.">
<meta name="robots" content="index,follow">
<title>Terms — KivU</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--paper:#f1f0e8;--ink:#17191e;--muted:#5c6069;--line:#d7d8d0;--blue:#525bff;--acid:#d5ff38;--coral:#ff684b;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:88px}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7}
a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.wrap{width:min(980px,calc(100% - 40px));margin:auto}
.skip-link{position:fixed;left:12px;top:-100px;z-index:2000;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:4px;font-weight:700;text-decoration:none}.skip-link:focus{top:12px}
.nav{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:-.08em;font-size:22px}
.brandmark{width:30px;height:30px;background:var(--acid);color:var(--ink);display:grid;place-items:center;font-weight:700;transform:rotate(-7deg)}
.links{display:flex;gap:18px;font-size:12px;flex-wrap:wrap}.links a{color:var(--muted);text-decoration:none}.links a:hover,.links a[aria-current]{color:var(--ink)}
main{padding:60px 0 80px}.kicker{font:10px/1.6 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
h1{font:700 clamp(44px,7vw,78px)/.9 var(--sans);letter-spacing:-.09em;margin:14px 0 18px}h1 em{font-style:normal;color:var(--coral)}
h2{font:700 25px/1.1 var(--sans);letter-spacing:-.05em;margin:40px 0 10px}
p,li{font-size:14px;color:#4f535c;max-width:78ch}ul{padding-left:20px}
.box{border:1px solid var(--line);background:#fffef7;padding:18px 20px;margin:22px 0}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 24px
